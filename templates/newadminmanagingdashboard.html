<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Admin Managing Dashboard</title>
    <style>
        table,
        tr,
        td {
            border: 1px solid gray;
            padding:10px 5px;
        }

        td button{
            padding: 5px;
            border-radius: 4px;
            border: 1px solid gray;
        }
        
    </style>
</head>

<body>
    <main>
        <table>
            <thead>
                <tr>
                    <th>SlId</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Fild</th>
                    <th>OTPstatus</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for singledata in serverdata %}
                <tr>
                    <td>{{singledata.slID}}</td>
                    <td>{{singledata.fullname}}</td>
                    <td>{{singledata.email}}</td>
                    <td>{{singledata.phone}}</td>
                    <td>{{singledata.ChooseFieldOfInterest}}</td>
                    <td>{{singledata.otpStatus}}</td>
                    <td>{{singledata.date}}</td>
                    <td><button id="{{singledata.slID}}" data-slid="{{singledata.slID}}" data-email="{{singledata.email}}" data-clickstatus="false" onclick="tigFunc(this)">Except</button></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </main>

    <script>
        let workig = false;

        async function tigFunc(e) {
            if(workig == false && e.getAttribute("data-clickstatus") == "false") {
                workig = true;
                e.setAttribute("data-clickstatus", "true");

                options = {
                    method: "POST",
                    body: JSON.stringify({
                        slid: e.getAttribute("data-slid"),
                        email: e.getAttribute("data-email")
                    }),
                    headers: {
                        "Content-type": "application/json; charset=UTF-8"
                    }
                }

                let ele = document.getElementById(e.getAttribute("id"));
                ele.style.backgroundColor = "yellow";
                ele.textContent = "Working...";

                let res = await fetch("/userbatchandemailrequest", options);

                let getData = await res.json();



                workig = false;
                ele.style.backgroundColor = "green";
                ele.style.color = "white";
                ele.textContent = "Done";


            }

        }
    </script>
</body>

</html>
