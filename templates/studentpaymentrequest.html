{% extends 'base.html' %}
{% load static %}
{% block title %}Payment Page - Goo Business{% endblock title %}
{% block head %}
<style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .payment-button {
            padding: 15px 30px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s ease;
            text-decoration: none;

        }

        .payment-button:hover {
            background-color: #0056b3;
        }
    </style>
    {% endblock head %}



    {% block body %}

    <div class="container">
        <h1>Payment Details</h1>
        <p>{{paymentmsg}}.</p>
        <p>Please click the button below to proceed with the payment.</p>
        <a href="/{{redirectEndpoint}}" class="payment-button" onclick="processPayment()">Pay &#8377;{{price}}</a>


    </div>

    {% endblock body %}
