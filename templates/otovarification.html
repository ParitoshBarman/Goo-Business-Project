{% extends 'base.html' %}
{% block title %}OTP Varification...{% endblock title %}
{% block head %}

<style>
     .ffrm input{display: block;margin:20px auto;font-size: 13vw;width: 40vw;text-align: center;border-radius: 25px;font-family: sans-serif;}
     .hov{background-color: rgb(181, 243, 87);border: 1px solid #ffa41c;}
     .hov:hover{background-color: #2874f0;color: white;}
     @media screen and (max-width:1066px) {.ffrm input{border-radius: 15px;}}
</style>

{% endblock head%}

{% block body %}
<main style="min-height: 80vh;">
    
<h1 style="text-align: center;font-family: sans-serif;font-size: xx-large;margin-top: 20px;">
     OTP Varification...
</h1>

<form action="ordersuccessfull" method="post" class="ffrm">
     {% csrf_token %}
     <input type="text" name="otp" maxlength="4" required>
     <input type="number" name="slid" value="{{slid}}" style="display: none;">
     <input type="submit" class="hov" style="font-size: 5vw;width: 30vw;margin-top: 50px;">
</form>
<div style="text-align: center;font-size: large;font-family: sans-serif;margin: 40px 0px;background-color: yellowgreen;padding: 2px 9px;">The OTP has been sent to your email</div>
<div style="text-align: center;font-size: large;font-family: sans-serif;margin: 40px 0px;background-color: yellow;padding: 5px 30px;">Note: You only get one chance</div>
</main>

{% endblock body %}
