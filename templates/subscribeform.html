{% extends 'base.html' %}
{% block title %}Subscribe information{% endblock title %}
{% block head %}
<style>
.fr{width:65vw; margin: auto;display: flex;flex-direction: column;font-family: sans-serif;align-items: center;}
.fr input{font-size: x-large;width: 50vw;border-top: none;border-left: none;border-right: none;margin-top: 20px;}
@media screen and (max-width:1066px) {
    .fr{width: 100vw;}
    .fr input{width: 80vw;}
}
</style>

{% endblock head%}

{% block body %}
<main style="min-height: 80vh;">
    
<h1 style="text-align: center;font-family: sans-serif;font-size: xx-large;margin-top: 20px;">
    Welcome to Goo-Business.
</h1>

<form action="/subscribe/emailsubmited" method="post" class="fr" style="margin-top: 35px;">
    {% csrf_token %}
    <input type="email" name="email" id="emailID" placeholder=" Email" required><br>
    <label for="emailID">&#9632; We will never share your email address</label><br>
    <button class="submit-btn" type="submit" style="width: 30vw;margin-top: 30px;padding: 10px 20px;
        background-color: #1D7FC9;
        border: 1px solid #1D7FC9;
        color: #fff;
        font-weight: bold;
        font-size: 1em;
        border-radius: 3px;">Subscribe</button>
</form>

</main>

{% endblock body %}
