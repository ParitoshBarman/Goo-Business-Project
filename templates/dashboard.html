
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/dashboardstyle.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />



</head>

<body>
    <header>
    <nav>
        <ul class="sidebar">
            <li onclick="hideSidebar()"><a href="#"><svg xmlns="http://www.w3.org/2000/svg" height="26"
                        viewBox="0 -960 960 960" width="26">
                        <path
                            d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
                    </svg></a></li>
            <li><a href="/dashboard">{{studentName}}</a></li>
            <li><a href="#">service</a></li>
            <li><a href="#">products</a></li>
            <li><a href="#">about</a></li>
            <li><a href="#">skills</a></li>
            <li><a href="#">logedin</a></li>
        </ul>
        <ul>
            <li><a href="/dashboard">{{studentName}}</a></li>
            <li class="hideOnMobile"><a href="#">products</a></li>
            <li class="hideOnMobile"><a href="#">service</a></li>
            <li class="hideOnMobile"><a href="#">about</a></li>
            <li class="hideOnMobile"><a href="#">skills</a></li>
            <li class="hideOnMobile"><a href="#">logedin</a></li>
            <li class="menu_btn" onclick="showsidebar()"><a href="#"><svg xmlns="http://www.w3.org/2000/svg" height="26"
                        viewBox="0 -960 960 960" width="26">
                        <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" />
                    </svg></a></li>

        </ul>
    </nav>
</header>

    <main>
        {{htmldata}}
    </main>
</body>

</html>
<script>
    function showsidebar() {
        const sidebar = document.querySelector(".sidebar")
        sidebar.style.display = "flex";
    }
    function hideSidebar() {
        const sidebar = document.querySelector(".sidebar")
        sidebar.style.display = "none";
    }

    let mainElement = document.querySelector("main");
    let htmlData = mainElement.textContent;
    mainElement.textContent = "";
    mainElement.innerHTML = htmlData;

</script>
