<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Goo Business</title>
    <style>
        body {
            font-family: 'Helvetica', sans-serif;
            background-color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #ecf0f1;
        }

        .login-container {
            background-color: #34495e;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
            width: 300px;
            max-width: 100%;
            text-align: center;
            padding: 40px;
            box-sizing: border-box;
        }

        h2 {
            color: #ecf0f1;
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin: 10px 0 5px;
            color: #bdc3c7;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            background-color: #2c3e50;
            color: #ecf0f1;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="login-container">
        {% if msg %}
        <div style="color: red;">{{msg}}</div>
        {% endif %}
        <h2>Student Login</h2>
        <form action="/studentLogin" method="post">
            {% csrf_token %}
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        
// Retrieve the password from local storage
const storedUsername = localStorage.getItem('studentUserneme');
const storedPassword = localStorage.getItem('studentPassword');

// Fill in the password field if it exists
if (storedPassword && storedUsername) {
    document.getElementById('username').value = storedUsername;
    document.getElementById('password').value = storedPassword;
}

// Add an event listener to the form submission
document.querySelector("form").addEventListener('submit', function (event) {
    // Store the password in local storage
    localStorage.setItem('studentUserneme', document.getElementById('username').value);
    localStorage.setItem('studentPassword', document.getElementById('password').value);
});
    </script>
</body>
</html>
